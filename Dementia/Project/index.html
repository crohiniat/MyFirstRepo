<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Daily Routine Capture</title>
</head>
<body>
    <h1>Input your daily Task here</h1>
	<input type="textarea" id="taskdetails" placeholder="Enter detailed comment">
    <input type="text" id="task" placeholder="Enter task">
    <select id="priority">
        <option value="low">Low Priority</option>
        <option value="medium">Medium Priority</option>
        <option value="high">High Priority</option>
    </select>
    <input type="date" id="time">
    <button id="add-task" onclick="saveToExcel()">Add Task</button>
	<br>
    <div id="task-list">
	<button id="fetch-task" onclick="readfromexcel()">Fetch Task Details</button>
	
	</div>
	<br>
	<div id='displaytask'></div>
    
	
	<script>
	import * as fs from 'node:fs';
        function saveToExcel() {
            const activity = document.getElementById('taskdetails').value;
            const time = document.getElementById('time').value;
			const task = document.getElementById('task').value;

            // Create a CSV-like string (you can customize this format)
            const csvData = `${activity},${time},${task}\n`;

            // Create a Blob (Excel-compatible format)
            const blob = new Blob([csvData], { type: 'text/csv;charset=utf-8;' });

            // Save the Blob as a file
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'daily_routines.csv';
            link.click();
        }
		
		function readfromexcel() {
		console.log("inside read excel..");
		const fs = require('fs').promises;
		//fs = require('fs');
const csv = require('csv-parser');

fs.createReadStream('data.csv')
  .pipe(csv())
  .on('data', (row) => {
    console.log(row);
  })
  .on('end', () => {
    console.log('CSV file successfully processed');
  });
}
		
	</script>
</body>
</html>
